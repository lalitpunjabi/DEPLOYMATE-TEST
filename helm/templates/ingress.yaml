{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deploymate
  labels:
    {{- include "deploymate.labels" . | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: {{ .Values.service.backend.port }}
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: {{ .Values.service.backend.port }}
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: {{ .Values.service.backend.port }}
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: {{ .Values.service.backend.port }}
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: {{ .Values.service.backend.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: {{ .Values.service.frontend.port }}
{{- end }}
