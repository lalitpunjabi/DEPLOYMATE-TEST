apiVersion: v1
kind: Secret
metadata:
  name: deploymate-secrets
  labels:
    {{- include "deploymate.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_APP_PASSWORD: {{ .Values.secrets.dbAppPassword | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  AI_INTERNAL_TOKEN: {{ .Values.secrets.aiInternalToken | quote }}
  GITHUB_WEBHOOK_SECRET: {{ .Values.secrets.githubWebhookSecret | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
