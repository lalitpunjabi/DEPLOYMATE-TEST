apiVersion: v1
kind: Secret
metadata:
  name: deploymate-secrets
  labels:
    {{- include "deploymate.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_APP_PASSWORD: {{ required "secrets.dbAppPassword is required (set via --set secrets.dbAppPassword=... or an external secret manager)." .Values.secrets.dbAppPassword | quote }}
  JWT_SECRET: {{ required "secrets.jwtSecret is required. The backend refuses to start with the insecure default." .Values.secrets.jwtSecret | quote }}
  AI_INTERNAL_TOKEN: {{ required "secrets.aiInternalToken is required. No built-in default exists." .Values.secrets.aiInternalToken | quote }}
  GITHUB_WEBHOOK_SECRET: {{ required "secrets.githubWebhookSecret is required to verify GitHub webhook HMAC signatures." .Values.secrets.githubWebhookSecret | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | default "" | quote }}
