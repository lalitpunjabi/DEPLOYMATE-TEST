replicaCount: 2

image:
  backend:
    repository: deploymate/backend
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    repository: deploymate/frontend
    tag: latest
    pullPolicy: IfNotPresent
  aiModule:
    repository: deploymate/ai-module
    tag: latest
    pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
