replicaCount:
  backend: 2
  frontend: 2
  ai: 1

image:
  backend:
    repository: deploymate/backend
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    repository: deploymate/frontend
    tag: latest
    pullPolicy: IfNotPresent
  aiModule:
    repository: deploymate/ai-module
    tag: latest
    pullPolicy: IfNotPresent

service:
  backend:
    port: 5000
  frontend:
    port: 80
  ai:
    port: 8000

ingress:
  enabled: true
  className: nginx
  host: deploymate.example.com
  tlsSecretName: deploymate-tls

env:
  nodeEnv: production
  # REQUIRED: your external PostgreSQL host. The chart intentionally does not
  # deploy or silently assume an in-cluster 'postgres' service (hardening spec §19).
  dbHost: ""
  dbPort: "5432"
  dbName: deploymate
  dbAppUser: deploymate_app
  aiMode: simulated
  frontendUrl: https://deploymate.example.com
  allowedOrigins: http://backend:5000
  # Optional Prometheus URL for LIVE telemetry. Empty => honest SIMULATED mode.
  prometheusUrl: ""

secrets:
  # Leave empty and provide via --set or a sealed-secret / external secret manager.
  dbAppPassword: ""
  jwtSecret: ""
  aiInternalToken: ""
  githubWebhookSecret: ""
  geminiApiKey: ""

resources:
  backend:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  frontend:
    limits:
      cpu: 250m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  ai:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
