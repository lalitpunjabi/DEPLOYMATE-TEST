name: DEPLOYMATE Dogfood CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test-and-build:
    name: Backend CI (TypeScript + Security Tests + Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Security Regression Tests
        run: |
          cd backend
          npx ts-node src/__tests__/security.test.ts

      - name: Run Dependency Audit
        run: |
          cd backend
          npm audit --audit-level=critical || true

      - name: Run TypeScript Build Check
        run: |
          cd backend
          npm run build

  frontend-test-and-build:
    name: Frontend CI (Vite + React 19 + Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vite Build Check
        run: |
          cd frontend
          npm run build

  ai-module-check:
    name: AI Module Python Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Check Syntax
        run: |
          cd ai-module
          pip install -r requirements.txt
          python -m compileall .
