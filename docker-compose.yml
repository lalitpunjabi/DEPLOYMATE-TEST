services:
  postgres:
    image: postgres:16-alpine
    container_name: deploymate-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-deploymate}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deploymate-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_APP_USER: ${DB_APP_USER:-deploymate_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_NAME: ${DB_NAME:-deploymate}
      JWT_SECRET: ${JWT_SECRET}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      AI_SERVICE_URL: http://ai-module:8000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-module:
    build:
      context: ./ai-module
      dockerfile: Dockerfile
    container_name: deploymate-ai-module
    restart: always
    environment:
      PORT: 8000
      ENVIRONMENT: development
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_MODE: ${AI_MODE:-simulated}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deploymate-frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
      ai-module:
        condition: service_healthy

volumes:
  postgres_data:
